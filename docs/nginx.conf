# ==============================================================================
# NEXVIX Innovations — High-Performance Production Nginx Configuration
# Reverse Proxy to Next.js (port 3000), HTTP/2, Brotli/Gzip, SSL & Security Headers
# ==============================================================================

# 1. HTTP Redirect to HTTPS (All Ports / Hosts)
server {
    listen 80;
    listen [::]:80;
    server_name nexvixinnovations.com www.nexvixinnovations.com;

    # ACME Challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://nexvixinnovations.com$request_uri;
    }
}

# 2. HTTPS WWW to Non-WWW Permanent 301 Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexvixinnovations.com;

    # SSL Certificates (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/nexvixinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexvixinnovations.com/privkey.pem;

    return 301 https://nexvixinnovations.com$request_uri;
}

# 3. Main Production Server Block (HTTPS Non-WWW)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexvixinnovations.com;

    # SSL Configuration (Modern Cipher Suite & TLS 1.2 / 1.3)
    ssl_certificate /etc/letsencrypt/live/nexvixinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexvixinnovations.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    # Content Security Policy (allows Next.js inline scripts and Google Fonts)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    # Compression Configuration: Gzip & Brotli
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Next.js Static Hashed Assets (1-Year Immutable Caching)
    location /_next/static/ {
        alias /var/www/nexvix-innovations/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Images & Favicons (1-Year Caching)
    location ~* \.(jpg|jpeg|png|webp|avif|ico|svg|woff|woff2)$ {
        root /var/www/nexvix-innovations/public;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Dynamic Next.js Node.js Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
